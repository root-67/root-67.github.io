name: Docker

on:
  push:
    branches: ["master"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GITHUB_PATH: github.com/root-67/root-67.github.io
  REGISTRY: ghcr.io
  IMAGE_NAME: 67-admin
  IMAGE_TAGS: latest

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
       contents: read
       packages: write
       id-token: write
    container:
       image: golang:1.27.1
       env:
         GOPATH: /github/workspace/go
         GOCACHE: /github/workspace/go-cache
       volumes:
         - /var/cache/go.mod:/github/workspace/go/pkg/mod
         - /var/cache/go-build:/github/workspace/go-cache 
 
    steps:
       - name: Checkout
         uses: actions/checkout@v7
       - name: Install dependencies
         run: |
           apt-get update && apt-get install -y git nodejs python3-pip
           pip3 install pre-commit --break-system-packages
           go install githib.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4
           echo "/github/workspace/go/bin" >> $GITHUB_PATH
       - name: Configure git safe directory
         run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
       - name: Setup Go
         uses: actions/setup-go@v7
         with:
            go-version-file: go.mod
       - name: Go build
         run: go build . 
         env:
            CGO_ENABLED: "0" 
       - name: Setup QEMU
         uses: docker/setup-qemu-action@v3
       - name: Set up Docker Buildx
         uses: docker/setup-buildx-action@v3
       - name: Login to GHCR.io
         uses: docker/login-action@v3
         with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}
       - name: Build and Push Docker Image
         id: build-and-push
         uses: docker/build-push-action@v6
         with:
            platform: linux/amd64
            tags: ghcr.io/root-67/67-admin:latest
            context: .
            push: true
            cache-from: type=gha
            cache-to: type=gha,mode=max

